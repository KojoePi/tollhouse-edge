# Shared edge proxy (Caddy). One instance for ALL projects on this server.
# Create the network once:  docker network create edge
name: edge
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
networks:
  edge:
    external: true
    name: edge
volumes:
  caddy_data:
  caddy_config:
